kind = "web"
previewPath = "/"
title = "CMS CoP Compliance Suite – Marketing Site"
description = "Public-facing marketing and social media landing page for the CMS CoP Compliance Suite. Showcases features, pricing, social proof, and drives signups. No backend needed."
version = "1.0.0"
id = "artifacts/marketing-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21209

[services.development]
run = "pnpm --filter @workspace/marketing-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketing-site/dist/public"

[[services.production.rewrites]]
from = "/sitemap.xml"
to = "/sitemap.xml"

[[services.production.rewrites]]
from = "/robots.txt"
to = "/robots.txt"

[[services.production.rewrites]]
from = "/affiliates/"
to = "/affiliates/index.html"

[[services.production.rewrites]]
from = "/affiliates"
to = "/affiliates/index.html"

[[services.production.rewrites]]
from = "/terms/"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/terms"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/privacy/"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21209"
BASE_PATH = "/"