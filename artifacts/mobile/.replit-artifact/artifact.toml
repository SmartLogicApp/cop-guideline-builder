kind = "mobile"
previewPath = "/mobile/"
title = "CMS Compliance Suite Mobile"
description = "A native mobile companion for compliance officers conducting facility rounds, with institution-specific CoP guidelines, inspection readiness checklists, and quick access to web-based gap scanning."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
