name: Marketing build credential contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  marketing-build-credential-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test marketing build credential contract
        run: pnpm run test:marketing-build-credential-contract
      - name: Confirm public pages keep authentication bundles private
        run: pnpm run test:marketing-browser-boundary
