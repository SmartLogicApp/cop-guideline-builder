openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generation
    description: AI-assisted compliance content generation
  - name: gap-history
    description: Durable gap analysis history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateWithAnthropic
      tags: [generation]
      summary: Generate structured compliance content
      description: Proxies a structured generation request to Anthropic without exposing credentials to the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: |
            Server-Sent Event stream. Each event contains a JSON data object.
            Progress events keep the request active; the terminal event is
            either `result` with GenerateResponse fields or `error` with an
            ErrorResponse field.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Upstream generation service timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gap-history:
    get:
      operationId: listGapHistory
      tags: [gap-history]
      summary: List gap analysis history
      responses:
        "200":
          description: Most recent gap analysis entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GapHistoryEntry"
    post:
      operationId: createGapHistory
      tags: [gap-history]
      summary: Save a gap analysis entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GapHistoryEntry"
      responses:
        "201":
          description: Saved gap analysis entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapHistoryEntry"
  /gap-history/{id}:
    delete:
      operationId: deleteGapHistory
      tags: [gap-history]
      summary: Delete a gap analysis entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Entry deleted
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateInput:
      type: object
      properties:
        systemPrompt:
          type: string
          minLength: 1
          maxLength: 30000
        userContent:
          type: string
          minLength: 1
          maxLength: 30000
        maxTokens:
          type: number
          minimum: 1
          maximum: 8192
        institutionValue:
          type: string
          description: Optional institution key (e.g. "hospital"). When provided the server pre-fetches the live eCFR regulatory text and injects it into the system prompt.
          maxLength: 50
      required:
        - systemPrompt
        - userContent
        - maxTokens
    GenerateResponse:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
            required:
              - type
              - text
        dataSource:
          $ref: "#/components/schemas/GenerationDataSource"
      required:
        - content
        - dataSource
    GenerationDataSource:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              const: ecfr
            fetchDate:
              type: string
          required:
            - kind
            - fetchDate
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              const: ai
          required:
            - kind
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GapHistoryEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 100
        institution:
          type: string
          maxLength: 100
        institutionLabel:
          type: string
          maxLength: 200
        topic:
          type: string
          maxLength: 300
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          multipleOf: 1
        timestamp:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
      required:
        - id
        - institution
        - institutionLabel
        - topic
        - score
        - timestamp
        - result

